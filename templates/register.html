<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register — TiffinTrack</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background: #fdf6ec; min-height: 100vh; display: flex; align-items: center; font-family: 'Segoe UI', sans-serif; }
        .auth-card { border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); border: none; }
    </style>
</head>
<body>
<div class="container" style="max-width: 400px;">
    <div class="card auth-card p-4">
        <h3 class="fw-bold text-center mb-1">🍱 TiffinTrack</h3>
        <p class="text-center text-secondary mb-4">Create your owner account</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-warning py-2 small">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label small text-secondary">Username</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label small text-secondary">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-dark w-100 fw-semibold">Create account</button>
        </form>
        <p class="text-center text-secondary small mt-3 mb-0">
            Already registered? <a href="/login">Log in</a>
        </p>
    </div>
</div>
</body>
</html>
